[package]
name = "blindspot-core"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[dependencies]
wasm-bindgen = "0.2"
raptorq = "2"
ruzstd = "0.8"   # pure-Rust zstd (no C toolchain needed for wasm32); pin/adjust API if version differs
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
